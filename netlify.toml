[build]
  base    = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Send all routes to index.html so React Router works on page refresh
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Required for WebLLM (SharedArrayBuffer needs cross-origin isolation)
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy   = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
